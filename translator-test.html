<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Translator Test</title>
<meta name="theme-color" content="#166B3F">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700&family=Noto+Naskh+Arabic:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<!-- Test page for the Conversation Translator. Not linked from the app and not loaded by it. It uses the Gemini key the
     Academy saved in this browser; recordings are kept in their own storage, so lesson progress is never touched. -->
<style>
:root{
  --bg:#F3F6F2; --surface:#ffffff; --sunk:#EEF2EE; --ink:#10231A; --muted:#5E6F66; --ink-2:#46584E; --line:#DCE4DD; --line-2:#C6D2C9;
  --green:#166B3F; --green-hi:#125A36; --on-green:#ffffff; --pale:#E4F1E8; --pale-ink:#125A36;
  --sand:#9A4A07; --sand-pale:#FCEFD9; --amber:#D17A12; --danger:#b42318; --danger-pale:#fdecea;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-ar:"Cairo","Segoe UI","Noto Naskh Arabic","Geeza Pro",sans-serif;
  --r-lg:20px; --r:14px; --shadow:0 1px 2px rgba(20,40,30,.05),0 6px 20px rgba(20,40,30,.06);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1512; --surface:#18201b; --sunk:#131a16; --ink:#e8efe9; --muted:#9aa89f; --ink-2:#b7c4bb; --line:#27322b; --line-2:#36443b;
    --green:#2aa765; --green-hi:#35b872; --on-green:#06140c; --pale:#183324; --pale-ink:#8fe2b2;
    --sand:#e2a85a; --sand-pale:#2c2416; --amber:#e2a85a; --danger:#f08a80; --danger-pale:#3a1d1a;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--green) 55%,transparent);outline-offset:2px;border-radius:10px}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));min-height:64px}
.top-in b{display:block;font-size:15px;font-weight:800}
.top-in small{display:block;font-size:12px;color:var(--muted)}
.logo{width:44px;height:44px;border-radius:13px;background:var(--green);color:var(--on-green);display:grid;place-items:center;flex:none}
.top-in .grow{flex:1;min-width:0}
.top-in a{font-size:13.5px;font-weight:700;color:var(--pale-ink);text-decoration:none;white-space:nowrap}
.wrap{max-width:760px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
h1,h2,h3{margin:0;letter-spacing:-.015em;text-wrap:balance}
.title{font-size:22px;font-weight:800;line-height:1.25}
.tag{font-size:12px;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:8px;background:var(--sunk);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tag.green{background:var(--pale);color:var(--pale-ink)} .tag.sand{background:var(--sand-pale);color:var(--sand)}
.muted{color:var(--muted)} .small{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--r);padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s,transform .05s;text-decoration:none;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--green);color:var(--on-green)} .btn.primary:hover{background:var(--green-hi)}
.btn.pale{background:var(--pale);color:var(--pale-ink)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)} .btn.ghost:hover{background:var(--sunk)}
.btn.danger{background:var(--surface);border-color:var(--line);color:var(--danger)}
.btn.block{width:100%} .btn.lg{padding:15px 20px;font-size:16px}
.btn:disabled{opacity:.55;cursor:default}
.btn.back{min-height:44px;padding:0 16px 0 12px;font-size:14px;border-color:var(--line-2)}
@keyframes eaa-toast{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;width:max-content;max-width:min(calc(100vw - 32px),520px);background:var(--green);color:var(--on-green);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:flex-start;box-shadow:0 10px 30px -6px rgba(14,74,48,.45)}
.toast.pop{animation:eaa-toast .26s cubic-bezier(.2,.7,.2,1)}
.tr-player{top:76px}
</style>
<link rel="stylesheet" href="translator.css?v=20261122k">
</head>
<body>
<header class="top"><div class="top-in">
  <span class="logo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg></span>
  <span class="grow"><b>Conversation Translator</b><small>Test page · not part of the app</small></span>
  <a href="./">Open the app</a>
</div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" hidden></div>
<script src="translator.js?v=20261122k"></script>
<script>
/* The small bit of the app the Translator needs: the page area, page switching and short messages. */
const $app = document.getElementById('app');
let toastTimer;
function toast(text){ const t = document.getElementById('toast'); t.innerHTML = text; t.hidden = false;
  t.classList.remove('pop'); void t.offsetWidth; t.classList.add('pop'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 6000); }
function show(view, id){
  if (view === 'progress'){ location.href = './'; return; }                 // "Open Settings": the key is added in the app's Settings
  (TR_VIEWS[view] || TR_VIEWS.tr)(id); window.scrollTo(0, 0);
}
TR_ON = true;                                                               // always on here
show('tr');
</script>
</body>
</html>
