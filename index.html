<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Egyptian Arabic Academy</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#166B3F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arabic Academy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700&family=Noto+Naskh+Arabic:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="m9.css">
<style>
/* Layout: one calm column; green marks the way forward, sand marks Arabic detail. */
:root{
  --bg:#F3F6F2; --surface:#ffffff; --sunk:#EEF2EE; --ink:#10231A; --muted:#5E6F66; --ink-2:#46584E; --line:#DCE4DD; --line-2:#C6D2C9;
  --green:#166B3F; --green-hi:#125A36; --on-green:#ffffff; --pale:#E4F1E8; --pale-ink:#125A36; --deep:#0F3D2A; --on-deep:#F1F7F2; --deep-soft:#A9CDB8;
  --sand:#9A4A07; --sand-pale:#FCEFD9; --amber:#D17A12; --danger:#b42318; --danger-pale:#fdecea;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-ar:"Cairo","Segoe UI","Noto Naskh Arabic","Geeza Pro",sans-serif;
  --r-lg:20px; --r:14px; --shadow:0 1px 2px rgba(20,40,30,.05),0 6px 20px rgba(20,40,30,.06);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1512; --surface:#18201b; --sunk:#131a16; --ink:#e8efe9; --muted:#9aa89f; --ink-2:#b7c4bb; --line:#27322b; --line-2:#36443b;
    --green:#2aa765; --green-hi:#35b872; --on-green:#06140c; --pale:#183324; --pale-ink:#8fe2b2; --deep:#0b2a1d; --on-deep:#eef6f0; --deep-soft:#8fbfa3;
    --sand:#e2a85a; --sand-pale:#2c2416; --amber:#e2a85a; --danger:#f08a80; --danger-pale:#3a1d1a;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--green) 55%,transparent);outline-offset:2px;border-radius:10px}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px} .ic.lg{width:26px;height:26px}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:800;letter-spacing:-.01em;cursor:pointer;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.logo{width:44px;height:44px;border-radius:13px;background:var(--green);color:var(--on-green);display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 4px 10px -4px rgba(22,107,63,.6);transition:transform .22s cubic-bezier(.2,.7,.2,1)}
.brand:hover .logo{transform:rotate(-6deg) scale(1.04)}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
nav{display:flex;gap:4px}
nav button{display:flex;align-items:center;gap:8px;min-height:44px;background:none;border:0;border-radius:12px;padding:0 14px;font-size:14px;font-weight:700;color:var(--ink-2);cursor:pointer;transition:background-color .16s,color .16s}
nav button:hover{background:var(--sunk);color:var(--ink)}
nav button.on,nav button.on:hover{background:var(--pale);color:var(--pale-ink)}
.tab-ic{display:contents}

.wrap{max-width:760px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.sec{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:10px 2px -4px}
h1,h2,h3{margin:0;letter-spacing:-.015em;text-wrap:balance}
.title{font-size:22px;font-weight:800;line-height:1.25}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.tag{font-size:12px;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:8px;background:var(--sunk);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tag.green{background:var(--pale);color:var(--pale-ink)} .tag.sand{background:var(--sand-pale);color:var(--sand)}
.muted{color:var(--muted)} .small{font-size:14px}
.meta{display:flex;align-items:flex-start;gap:8px;color:var(--muted);font-size:14px}
.meta .ic{margin-top:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.grow{flex:1;min-width:0}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--r);padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s,transform .05s;text-decoration:none;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--green);color:var(--on-green)} .btn.primary:hover{background:var(--green-hi)}
.btn.pale{background:var(--pale);color:var(--pale-ink)} .btn.pale:hover{filter:brightness(.97)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)} .btn.ghost:hover{background:var(--sunk)}
.btn.danger{background:var(--surface);border-color:var(--line);color:var(--danger)}
.btn.block{width:100%} .btn.lg{padding:15px 20px;font-size:16px}
.btn:disabled{opacity:.55;cursor:default}
.iconbtn{flex-direction:column;gap:4px;padding:12px 10px;font-size:13px;min-width:92px}

/* Progress */
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:99px}
.bar.mini{width:64px;height:6px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow)}
.stat .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--pale);color:var(--pale-ink);flex:none}
.stat.sand .ico{background:var(--sand-pale);color:var(--sand)}
.stat b{display:block;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.ring{flex:none}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--sunk)} .ring .fg{stroke:var(--green);stroke-linecap:round;transform:rotate(-90deg);transform-origin:center}
.ring text{font:700 13px var(--font);fill:var(--ink)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
/* Home (redesign): two columns on wide screens; the curriculum lesson is always first */
.h-sec{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:4px 2px -2px}
.wrap.wide{max-width:1200px}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:36px}
.col-a,.col-b{min-width:0;display:flex;flex-direction:column;gap:16px}
@media (min-width:1000px){ .layout{grid-template-columns:400px minmax(0,1fr);gap:48px;align-items:start} .col-a.stick{position:sticky;top:92px} }
.hd{margin:0;font-size:20px;font-weight:800;letter-spacing:-.015em;line-height:1.3}
.hd-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hd-count{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.home .card{border-radius:22px;box-shadow:0 1px 2px rgba(16,35,26,.04),0 14px 34px -20px rgba(16,35,26,.2)}
.hero{container:hero/inline-size;padding:0}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;padding:20px}
@container hero (min-width:600px){
  .hero-grid{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);grid-template-areas:"body phrase" "cta phrase";column-gap:28px;padding:24px}
  .hero-body{grid-area:body} .pp{grid-area:phrase} .hero-cta{grid-area:cta;align-self:end}
}
.hero-body{display:flex;flex-direction:column;gap:18px}
.lc-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.lc-pill{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:99px;background:var(--pale);color:var(--pale-ink);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.lc-code{font-size:12.5px;font-weight:700;letter-spacing:.03em;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.lc-title{margin:10px 0 0;font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.2;text-wrap:balance}
.lc-scen{margin:10px 0 0;font-size:15px;line-height:1.55;color:var(--ink-2);text-wrap:pretty}
.lc-prog{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px}
.lc-prog b{font-weight:700}
.conf{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--pale-ink);white-space:nowrap}
.conf .ic{width:14px;height:14px;stroke-width:3;align-self:center}
.conf.zero{color:var(--muted);font-weight:600}
.segs{display:grid;gap:6px;margin-top:10px}
.seg{height:8px;border-radius:99px;background:var(--line)}
.seg.done{background:var(--green)}
.seg.now{background:var(--pale);box-shadow:inset 0 0 0 2px var(--green)}
.pp{display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:164px;padding:18px 20px 20px;border-radius:16px;background:var(--deep);color:var(--on-deep)}
.pp-k{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--deep-soft)}
.pp-ar{margin:0;font-family:"Noto Naskh Arabic",var(--font-ar);font-weight:700;line-height:1.5;text-align:left;color:#fff;overflow-wrap:anywhere}
.pp-en{margin:2px 0 0;font-size:16px;font-weight:600;color:color-mix(in srgb,var(--on-deep) 85%,var(--deep-soft))}
.home .btn.primary{min-height:52px;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 1px 2px rgba(14,74,48,.32),0 8px 18px -8px rgba(22,107,63,.55)}
.home .btn.primary:hover{background:var(--green-hi)}
.sub{padding:18px;display:flex;flex-direction:column;gap:12px}
.sc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sc-title{font-size:16px;font-weight:700;line-height:1.35}
.sc-tag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;padding-top:3px}
.sc-right{display:flex;align-items:flex-start;gap:4px;flex:none}
.sc-x{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;height:44px;margin:-12px -12px -8px 0;padding:0 10px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.sc-x:hover{background:var(--sunk);color:var(--ink)}
.sc-x.armed,.sc-x.armed:hover{background:var(--danger-pale);color:var(--danger)}
.sc-right:has(.sc-x.armed) .sc-tag{display:none}
.sc-meta{font-size:13px;color:var(--muted);margin-top:2px}
.sub .segs{margin-top:8px}
.sc-next{font-size:14px;color:var(--ink-2)} .sc-next .ar{font-family:"Noto Naskh Arabic",var(--font-ar);font-weight:700;font-size:20px;color:var(--ink)}
.home .stats{gap:12px}
.home .stat{flex-direction:column;align-items:flex-start;gap:12px;padding:14px;border-radius:18px;box-shadow:none}
.home .stat .ico{width:32px;height:32px;border-radius:10px}
.home .stat .ico .ic{width:18px;height:18px}
.home .stat b{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.home .stat b small{font-size:14px;font-weight:700;letter-spacing:0;color:var(--muted)}
.home .stat div>span{display:block;margin-top:2px;font-size:12.5px;font-weight:600;line-height:1.35;color:var(--ink-2)}
.btn.round{border-radius:99px;margin-top:18px}

/* Lesson overview */
.ov-title{font-size:30px;font-weight:800;line-height:1.15;letter-spacing:-.02em}
.ov-card{border-radius:22px}
.ov-h{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700}
.ov-h .ic{color:var(--muted)}
.ov-scen{font-size:17px;margin:12px 0 0}
.ov-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center;border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.ov-stats b{display:block;font-size:26px;font-weight:800;line-height:1.3} .ov-stats b.ov-st{font-size:19px;padding-top:4px}
.ov-stats span{color:var(--muted);font-size:14px}
.ov-sub{color:var(--muted);margin:0 2px;font-size:15px}
.ov-text{margin:0 2px;font-size:17px}
.ov-list{padding:4px 18px;border-radius:22px}
.ov-ex{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:18px 0;cursor:pointer}
.ov-ex:first-child{border-top:0}
.ov-n{width:32px;height:32px;border-radius:9px;background:var(--sunk);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted);flex:none;margin-top:4px}
.ov-ar{display:block;font-family:var(--font-ar);font-weight:700;font-size:24px;line-height:1.5;text-align:left;unicode-bidi:plaintext}
.ov-lat{display:block;font-weight:600;margin-top:4px}
.ov-en{display:block;color:var(--muted)}
.ov-ok{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--pale-ink);background:var(--pale);padding:3px 8px;border-radius:99px;flex:none;margin-top:6px}
.btn.round-sm{border-radius:99px;padding:8px 14px}

/* Modules (redesign) */
.mod-intro{margin:6px 0 0;max-width:62ch;font-size:14px;line-height:1.55;color:var(--ink-2);text-wrap:pretty}
.mod-tools{display:flex;flex-wrap:wrap;gap:10px}
.msearch{flex:1 1 180px;min-width:0;display:flex;align-items:center;gap:10px;min-height:48px;padding:0 6px 0 14px;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;color:var(--muted);transition:border-color .16s,box-shadow .16s,color .16s}
.msearch:hover{border-color:color-mix(in srgb,var(--line-2) 60%,var(--muted))}
.msearch:focus-within{border-color:var(--green);box-shadow:0 0 0 4px rgba(22,107,63,.16);color:var(--green)}
.msearch input[type=text]{flex:1;min-width:0;height:46px;padding:0;border:0;border-radius:0;outline:0;box-shadow:none;background:transparent;font-size:16px;font-weight:500;color:var(--ink)}
.msearch input::placeholder{color:var(--muted);opacity:1}
.mclear{flex:none;display:grid;place-items:center;width:36px;height:36px;padding:0;border:0;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer}
.mclear:hover{background:var(--sunk);color:var(--ink)}
.mod-tools .btn{min-height:48px;padding:0 16px;font-size:14px;border-color:var(--line-2)}
.mres{margin:0;font-size:13px;font-weight:600;color:var(--ink-2)}
.mods{display:flex;flex-direction:column;gap:10px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:18px;transition:border-color .18s,box-shadow .18s}
.mod:hover{border-color:var(--line-2);box-shadow:0 10px 24px -18px rgba(16,35,26,.28)}
.mod[open]{border-color:color-mix(in srgb,var(--green) 18%,var(--line));box-shadow:0 1px 2px rgba(16,35,26,.04),0 16px 32px -22px rgba(16,35,26,.28)}
.mod summary{padding:14px 14px 14px 16px;gap:14px;font-weight:400;border-radius:17px}
.mod-num{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:var(--sunk);color:var(--ink-2);font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;transition:background-color .2s,color .2s}
.mod.active .mod-num{background:var(--pale);color:var(--pale-ink)}
.mod[open] .mod-num{background:var(--green);color:var(--on-green)}
/* A completed module turns green: tinted card, green border, a tick in place of its number */
.mod.done{background:var(--pale);border-color:var(--green)}
.mod.done .mod-num{background:var(--green);color:var(--on-green)}
.mod.done .mod-num .ic{width:22px;height:22px;stroke-width:3}
.mod.done .mod-count{color:var(--pale-ink);font-weight:600}
.mod.done .list{border-top-color:rgba(22,107,63,.2)}
.mod.done .lesson-row:hover{background:var(--surface)}
.mod-done{display:inline-flex;align-items:center;gap:4px;margin-left:8px;padding:2px 8px;border-radius:99px;background:var(--green);color:var(--on-green);font-size:10.5px;letter-spacing:.05em;vertical-align:1px}
.mod-done .ic{width:12px;height:12px;stroke-width:2.6}
.mod-banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:var(--green);color:var(--on-green)}
.mod-banner>.ic{width:24px;height:24px;flex:none}
.mod-banner b{display:block;font-size:16px;line-height:1.35}
.mod-banner span{display:block;font-size:14px;opacity:.9;margin-top:2px}
.mod-h{display:block;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.mod-name{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.3;color:var(--ink)}
.mod-count{display:block;font-size:13px;font-weight:500;line-height:1.4;color:var(--muted);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px;flex:none}
.dot{width:14px;height:6px;border-radius:99px;background:var(--line)}
.dot.p{background:#E08A1E} .dot.c{background:var(--green)}
.mod .chev-box{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;color:var(--muted)}
.mod summary:hover .chev-box{background:var(--sunk);color:var(--ink)}
.mod .chev{transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.mod .list{margin:0 16px;padding:8px 0 10px;border-top:1px solid var(--line)}
.mod .lesson-row{gap:12px;padding:8px;margin:0 -8px;width:calc(100% + 16px)}
.mod .lesson-row:hover{background:var(--bg)}
.st{flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--line-2)}
.st .half,.st .tick{display:none}
.st.p{color:var(--amber)} .st.p .half{display:block;fill:currentColor;stroke:none}
.st.c{color:var(--green)} .st.c .ring{fill:currentColor} .st.c .tick{display:block;stroke:#fff}
.l-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--muted);font-variant-numeric:tabular-nums}
.l-st.p{color:var(--sand)} .l-st.c{color:var(--pale-ink)}
.l-title{display:block;font-size:15px;font-weight:600;line-height:1.35;color:var(--ink);overflow-wrap:anywhere}
.view{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--pale-ink);font-size:13px;font-weight:700}
.lesson-row:hover .view{background:var(--pale);border-color:color-mix(in srgb,var(--green) 18%,var(--line))}
.view .ic{width:15px;height:15px}
.mnone{display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 24px;background:var(--surface);border:1px dashed var(--line-2);border-radius:18px;text-align:center}

/* Lesson */

.lmeta>.ic{margin-top:3px;width:18px;height:18px;color:var(--muted)}

/* Lesson (redesign): phrase card beside the tutor and actions on wide screens, one column below 960px */
.lesson{container:lesson/inline-size;width:100%;max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.lesson>.note{margin-top:0}

.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:384px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:92px;padding:12px 8px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;transition:background-color .16s ease,border-color .16s ease,box-shadow .16s ease,transform .12s ease}

.tile.on .tile-ic,.tile.on:hover .tile-ic{background:var(--green);color:var(--on-green);animation:eaa-beat 1.1s ease-in-out infinite}

/* Lesson preview (redesign): scenario + continue on the left, the expression list on the right from 1000px */

.note{background:var(--pale);color:var(--pale-ink)}
.warn{background:var(--danger-pale);color:var(--danger)}
.note .ic,.warn .ic{margin-top:1px}

/* Tutor */
.tutor-head{display:flex;gap:12px;align-items:flex-start}
.tutor-ico{width:42px;height:42px;border-radius:13px;background:var(--sand-pale);color:var(--sand);display:grid;place-items:center;flex:none}
.log{max-height:280px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-top:14px;padding:2px}
.log p{margin:0;max-width:85%;padding:9px 13px;border-radius:16px;font-size:15px;line-height:1.5}
.log p[data-who="tutor"]{background:var(--sunk);border-bottom-left-radius:5px;align-self:flex-start}
.log p[data-who="me"]{background:var(--green);color:var(--on-green);border-bottom-right-radius:5px;align-self:flex-end}
.log:empty{display:none}
.tstatus{display:flex;align-items:center;gap:8px;min-height:22px;margin:10px 0;font-size:14px;color:var(--muted)}
.compose{display:flex;gap:8px;margin-top:10px}
input[type=text],input[type=password],textarea{width:100%;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px}
input:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 20%,transparent)}
textarea{min-height:110px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.live{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite;flex:none}
@keyframes pulse{50%{opacity:.3}}

/* Search */
.searchbox{position:relative}
.searchbox>.ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbox input{padding-left:44px;padding-right:50px}
.searchbox .sclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px}
.result{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 4px;cursor:pointer}
.result:hover{background:var(--sunk)}
div.result{cursor:default;flex-wrap:wrap}
.chips-intro{margin:2px 0 12px;font-size:14px;color:var(--muted)} .chips-intro b{color:var(--ink)}
.chip-group{margin-top:14px} .chip-group>b{display:block;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background-color .14s,border-color .14s}
.chip:hover{background:var(--pale);border-color:var(--green);color:var(--pale-ink)} .chip:active{transform:scale(.97)}
.r-open{flex:1 1 220px;min-width:0;text-align:left;background:none;border:0;padding:0;color:var(--ink);font:inherit;cursor:pointer}
.r-play{display:flex;gap:8px;flex:none}
.btn.sm{padding:8px 12px;font-size:14px;gap:6px}
.btn.ghost.sm{border-color:var(--line-2)}
.result .ar{font-family:var(--font-ar);font-weight:700;direction:rtl;font-size:20px}

/* Microphone banner */
.wrap.micbar{padding-top:14px;padding-bottom:0}
.micbar .note,.micbar .warn{margin-top:0;align-items:center;flex-wrap:wrap}
.micbar .note>div,.micbar .warn>div{flex:1;min-width:200px}
.micbar .btn{padding:8px 14px;font-size:14px;background:var(--surface);border-color:var(--line);color:var(--ink)}

/* Footer */
.foot{display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 16px 28px;font-size:13px;color:var(--muted)}
.foot.off>*{display:none}   /* "Powered by" shows only on Settings; the footer's bottom space stays so pages clear the tab bar */
.foot button{background:none;border:0;padding:6px 10px;color:var(--muted);cursor:pointer;font-weight:600}
.foot button:hover{color:var(--ink)}
.foot a{color:var(--pale-ink);font-weight:700}

/* Toast */
/* Motion: each new page fades and rises in, and its cards follow in a short cascade (capped at ~0.5 s).
   Re-rendering the same page (the next phrase card) only eases the main card. Reduced-motion turns all of this off. */
@keyframes eaa-page{from{opacity:0}to{opacity:1}}
@keyframes eaa-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes eaa-soft{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
#app.enter{animation:eaa-page .22s ease-out}
#app.enter [data-anim]{animation:eaa-in .42s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:min(calc(var(--i) * 45ms),495ms)}
details.mod.opening .lesson-row{animation:eaa-in .32s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:min(calc(var(--i, 0) * 35ms), 280ms)}
#app.enter-soft :is(.phrase,.lprog,.hero,.pv-cont){animation:eaa-soft .28s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes eaa-toast{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.toast.pop{animation:eaa-toast .26s cubic-bezier(.2,.7,.2,1)}
.toast .muted{color:inherit;opacity:.82;font-weight:500}   /* secondary text, e.g. "(Google voice)", in a softer shade of the toast's own text */
@keyframes eaa-modal{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes eaa-fade{from{opacity:0}to{opacity:1}}
dialog.modal[open]{animation:eaa-modal .24s cubic-bezier(.2,.7,.2,1)}
dialog.modal[open]::backdrop{animation:eaa-fade .24s ease-out}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;width:max-content;max-width:min(calc(100vw - 32px),520px);background:var(--green);color:var(--on-green);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:flex-start;box-shadow:0 10px 30px -6px rgba(14,74,48,.45)}

/* Phone: navigation moves to a bottom tab bar */
@media (max-width:620px){
  .top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--surface)}  /* a blur here would trap the fixed tab bar inside the header */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--surface);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom))}
  nav button{flex-direction:column;justify-content:center;gap:3px;min-height:52px;font-size:12px;padding:0;color:var(--muted)}
  nav button:hover,nav button.on,nav button.on:hover{background:none}
  nav button.on{color:var(--pale-ink)}
  .tab-ic{display:grid;place-items:center;width:56px;height:28px;border-radius:99px;transition:background-color .2s}
  nav button:active .tab-ic{background:var(--sunk)}
  nav button.on .tab-ic{background:var(--pale)}
  .dots{display:none}
  .foot{padding-bottom:calc(92px + env(safe-area-inset-bottom))}   /* clears the bottom tab bar */
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .stats{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .stat{flex-direction:column;align-items:flex-start;padding:12px;gap:8px}
  .iconbtn{min-width:0;flex:1}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="brand" onclick="show('dashboard')" aria-label="Go to dashboard">
      <span class="logo" id="logoMark"></span>

    </button>
    <nav id="nav">
      <button data-v="dashboard"></button>
      <button data-v="search"></button>
      <button data-v="progress"></button>
    </nav>
  </div>
</header>
<div class="wrap micbar" id="micbar" role="status" hidden></div>
<div class="wrap micbar" id="appbar" role="status" hidden></div>
<main class="wrap" id="app"></main>
<footer class="foot"><button id="poweredBy" aria-expanded="false" onclick="this.setAttribute('aria-expanded','true');document.getElementById('contact').hidden=false">Powered by</button>
  <a id="contact" href="mailto:sajeeu@gmail.com" hidden>sajeeu@gmail.com</a></footer>
<div class="toast" id="toast" role="status" hidden></div>

<script src="curriculum.js"></script>
<!-- Module 09 (Pediatrics): lesson data, then its pages. The app still runs as Modules 01-08 if these fail to load. -->
<script src="module9.js"></script>
<script src="m9.js"></script>
<script>
/* ---------- State ---------- */
const KEY = 'egyptian_academy_v92';
const HAS_M9 = typeof M9_VIEWS !== 'undefined' && !!M9_VIEWS;   // Module 09 is loaded (m9.js added its lessons to CURRICULUM)
const byId = Object.fromEntries(CURRICULUM.map(l => [l.id, l]));
// Totals come from the curriculum, so adding a module later needs no other change.
const MODULES = [...new Set(CURRICULUM.map(l => l.module))].sort((a, b) => a - b);
const N_LESSONS = CURRICULUM.length, N_PHRASES = CURRICULUM.reduce((n, l) => n + l.ex.length, 0);
// Module names, as given by the course author (not part of the curriculum file).
const MODULE_NAMES = { 1: 'Greetings & Introductions', 2: 'Everyday Essentials', 3: 'Everyday Conversations', 4: 'Hospital Team Communication',
  5: 'Patient Interviews', 6: 'Examinations & Patient Care', 7: 'Clinical Communication', 8: 'Advanced Egyptian Conversations', 9: 'Pediatrics' };
const label = id => id.replace('_', ' ');        // "M01_L01" -> "M01 L01"
// iPhone or iPad (iPadOS reports itself as a Mac with a touch screen). Their Home Screen app keeps its own storage.
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let installPrompt = null;                         // Chrome's install prompt, when it offers one
const modTitle = ['', '', '', '', '', '', '', '', '']; // curriculum defines no module names, so none are shown

function freshState(){ return { completed: [], lessons: {}, verified_spoken_passes: 0, mode: 'simplified_learner_confirmed' }; }
let S = load();
function load(){ let st = null; try { st = JSON.parse(localStorage.getItem(KEY)); } catch {} return repair(st || freshState()); }
/* Keeps saved progress usable after an app update: if a lesson ever gets fewer phrases, positions are kept in range,
   and progress for a lesson ID that no longer exists is set aside in "retired" (never thrown away). */
function repair(st){
  st = { ...freshState(), ...st, lessons: { ...(st.lessons || {}) }, retired: { ...(st.retired || {}) } };
  for (const i of st.completed || []) if (!byId[i]) st.retired[i] = 'completed';
  st.completed = [...new Set((st.completed || []).filter(i => byId[i]))];
  for (const [id, x] of Object.entries(st.lessons)){
    if (!byId[id] || !x || typeof x !== 'object'){ st.retired[id] = x; delete st.lessons[id]; continue; }
    const n = byId[id].ex.length;
    const confirmed = [...new Set((Array.isArray(x.confirmed) ? x.confirmed : []).filter(c => Number.isInteger(c) && c >= 1 && c <= n))];
    st.lessons[id] = { ...x, confirmed, idx: Math.min(Math.max(Number.isInteger(x.idx) ? x.idx : 1, 1), n) };
  }
  if (!Object.keys(st.retired).length) delete st.retired;
  if ('dismissed' in st) st.dismissed = Array.isArray(st.dismissed) ? st.dismissed.filter(i => byId[i]) : [];   // Home cards she removed
  return st;
}
function save(){ S.last_updated = new Date().toISOString(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
const snapshotText = st => `ACADEMY_STATE_V9\n${JSON.stringify(st)}`;
// Check a pasted or saved snapshot; returns the state, or null if it isn't valid.
function parseSnapshot(text){
  try {
    const obj = JSON.parse(String(text).replace(/^\s*ACADEMY_STATE_V9\s*/, ''));
    const ok = (obj.completed || []).every(i => byId[i]) && Object.entries(obj.lessons || {}).every(([i, x]) =>
      byId[i] && Number.isInteger(x.idx) && x.idx >= 1 && x.idx <= byId[i].ex.length && Array.isArray(x.confirmed));
    return ok ? { ...freshState(), ...obj } : null;
  } catch { return null; }
}

/* Daily backup: a copy of the progress is kept in this browser every day at 23:00 (the last 7 days).
   A web page can't run while it is closed, so a missed 23:00 is caught up the next time the app opens;
   nothing can change while it is closed, so that copy is the same as it was at 23:00. */
const BKEY = 'egyptian_academy_backups';
const backups = () => { try { return JSON.parse(localStorage.getItem(BKEY)) || []; } catch { return []; } };
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function dailyBackup(){
  const now = new Date(), due = new Date(now);
  if (now.getHours() < 23) due.setDate(due.getDate() - 1);           // the most recent 23:00 that has passed
  const slot = dayKey(due), list = backups();
  if (list[0]?.slot >= slot) return;                                 // already backed up for that 23:00
  if (!S.completed.length && !Object.keys(S.lessons).length) return; // nothing to back up yet
  list.unshift({ slot, at: now.toISOString(), state: S });
  try { localStorage.setItem(BKEY, JSON.stringify(list.slice(0, 7))); } catch {}
}

const isDone = id => S.completed.includes(id);
const status = id => isDone(id) ? 'complete' : (S.lessons[id] ? 'in_progress' : 'not_started');
// Primary = earliest lesson in curriculum order that is not complete (never "last visited").
const primary = () => CURRICULUM.find(l => !isDone(l.id)) || null;
const others = () => { const p = primary(); return CURRICULUM.filter(l => l !== p && status(l.id) === 'in_progress' && l.module !== 9); };   // Module 09 has its own "Next in Pediatrics" card
const confirmedCount = () => Object.values(S.lessons).reduce((a, x) => a + x.confirmed.length, 0);

function startLesson(id){ if (!S.lessons[id]) { S.lessons[id] = { idx: 1, confirmed: [] }; save(); } }

/* Learner confirms the current expression. Idempotent: only the active expression can be confirmed, once. */
function confirmExpression(id, n){
  const L = byId[id], st = S.lessons[id];
  if (!st || isDone(id) || st.idx !== n || st.confirmed.includes(n)) return;   // ignore duplicates / stale clicks
  st.confirmed.push(n);
  if (n < L.ex.length) { st.idx = n + 1; save(); return show('lesson', id); }
  S.completed.push(id); save();                                               // lesson complete, counted once
  const i = CURRICULUM.indexOf(L);
  const next = CURRICULUM.slice(i + 1).find(l => !isDone(l.id));
  if (!next) return show('finished');
  startLesson(next.id); show('lesson', next.id, { justFinished: id });
}

/* ---------- Speech (browser, free) ---------- */
let arVoice = null, currentUtterance = null;
// Prefer an Egyptian natural voice (Edge has "Microsoft Salma/Shakir Online (Natural) - Arabic (Egypt)").
function pickVoice(v = speechSynthesis.getVoices()){
  const ar = v.filter(x => /^ar/i.test(x.lang));
  arVoice = ar.find(x => /ar-EG/i.test(x.lang) && /natural|online/i.test(x.name)) || ar.find(x => /ar-EG/i.test(x.lang))
         || ar.find(x => /natural|online/i.test(x.name)) || ar[0] || null;
  return arVoice;
}
// Voices load in the background; wait for them (up to 2 s) the first time.
function loadVoices(){
  return new Promise(res => {
    const v = speechSynthesis.getVoices(); if (v.length) return res(v);
    const done = () => res(speechSynthesis.getVoices());
    speechSynthesis.addEventListener('voiceschanged', done, { once: true });
    setTimeout(done, 2000);
  });
}
if ('speechSynthesis' in window){ loadVoices().then(pickVoice); speechSynthesis.addEventListener('voiceschanged', () => pickVoice()); }

/* Speak Arabic. msg(text) shows what happened on the card; without it, problems use an alert. */
async function speak(text, rate = 0.85, msg){
  const say = msg || (t => t && toast(t));
  if ('speechSynthesis' in window) pickVoice(await loadVoices());
  if (!('speechSynthesis' in window) || !arVoice){
    // Many phones and browsers have no Arabic voice: use Google's voice instead (same free key as the tutor).
    if (localStorage.getItem('gemini_key')) return geminiSay(text, rate < 0.7, say);
    return say('This browser has no Arabic voice. To hear the phrases, add your free Google key in <b>Settings → Tutor setup</b>; Listen will then use Google\'s voice.');
  }
  if (speechSynthesis.speaking || speechSynthesis.pending){ speechSynthesis.cancel(); await new Promise(r => setTimeout(r, 80)); }
  speechSynthesis.resume();                                   // un-sticks a paused speech queue
  const u = currentUtterance = new SpeechSynthesisUtterance(text); // keep a reference so it isn't garbage-collected mid-speech
  u.voice = arVoice; u.lang = arVoice.lang; u.rate = rate;
  let started = false;
  u.onstart = () => { started = true; msg && msg(`Playing… <span class="muted">(${esc(arVoice.name)})</span>`); };
  u.onend = () => { msg && msg(''); };
  u.onerror = e => { if (e.error !== 'interrupted' && e.error !== 'canceled') say(`Audio couldn't play (${e.error}). Check your internet connection (Edge's natural voices are online) and try again.`); };
  speechSynthesis.speak(u);
  msg && msg('Starting audio…');
  setTimeout(() => { if (!started && currentUtterance === u) say(`No sound started with the voice "${arVoice.name}". Check the volume and that this tab isn't muted, then tap again.`); }, 4000);
}

/* Mic practice: shows what the browser heard. It is NOT a pronunciation score. */
function listen(outEl, onEnd){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ outEl.innerHTML = warn('Your browser does not support speech recognition. Use Chrome or Edge, or type to the tutor below.'); return onEnd?.(); }
  const r = new SR(); r.lang = 'ar-EG'; r.interimResults = false;
  r.onend = () => onEnd?.();
  outEl.innerHTML = note('mic', '<span class="live"></span> Listening… say the phrase.');
  r.onresult = e => { outEl.innerHTML = note('mic', `I heard: <b dir="rtl">${esc(e.results[0][0].transcript)}</b><br><span class="small">This is just what the browser recognised, not a pronunciation grade. You decide when you're ready.</span>`); };
  r.onerror = e => { outEl.innerHTML = warn(`Couldn't hear you (${esc(e.error)}). Check microphone permission and try again.`); };
  r.start();
}

/* ---------- Tutor (Google Gemini Live) ----------
   A live spoken conversation, like ChatGPT Voice: your microphone streams to Gemini and
   its voice streams back. Uses your own Google AI Studio key, saved only in this browser. */
const GEMINI_WS = 'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=';
const GEMINI_MODEL = 'models/gemini-3.8-live';
let tutor = null;

function tutorPrompt(L, ex){
  return `You are a warm, patient Egyptian Arabic tutor in a live voice conversation. The learner is a female doctor working in an Egyptian hospital, a beginner. Explain in English; practise in Egyptian colloquial Arabic (Cairo dialect, not Modern Standard Arabic). Speak Arabic slowly and clearly.

Current lesson: ${label(L.id)} — ${L.title}
Scenario: ${L.scenario}
Lesson expressions (use these EXACT phrases; do not invent other lesson phrases):
${L.ex.map(e => `${e.n}. ${e.ar} | ${e.lat} | ${e.en}`).join('\n')}

Focus now on expression ${ex.n}: ${ex.ar} (${ex.lat}) — "${ex.en}".
Begin by greeting briefly, say this phrase slowly, and invite the learner to repeat it. Then help them practise: answer questions about meaning or pronunciation, give short gentle tips, and do a short role-play from the scenario using this and earlier phrases of the lesson.
Keep each turn short (one to three sentences) and then let the learner speak. Never tell the learner the phrase or lesson is complete; they tap "Complete" in the app themselves when they feel ready.`;
}

function setStatus(msg){ const el = document.getElementById('tstatus'); if (el) el.innerHTML = msg; }
/* Show transcripts: consecutive pieces from the same speaker join into one line. */
function addText(who, text){
  const log = document.getElementById('log'); if (!log || !text) return;
  const last = log.lastElementChild;
  if (last && last.dataset.who === who && !last.dataset.closed){ last.querySelector('span').textContent += text; }
  else { log.insertAdjacentHTML('beforeend', `<p data-who="${who}"><span></span></p>`); log.lastElementChild.querySelector('span').textContent = text; }
  log.scrollTop = 1e9;
}
function closeLine(){ const last = document.getElementById('log')?.lastElementChild; if (last) last.dataset.closed = '1'; }

const b64ToBytes = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
function bytesToB64(u8){ let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }

/* Mic capture. The audio runs at the device's own rate (phones often can't use a custom rate) and is
   converted here to the 16 kHz, 16-bit PCM Gemini expects, sent in ~100 ms chunks. */
const WORKLET = `class Cap extends AudioWorkletProcessor{process(i){const c=i[0][0];if(c)this.port.postMessage(c.slice(0));return true}}registerProcessor('cap',Cap)`;
// While the tutor is talking (and briefly after), the mic is not sent: on phones the loudspeaker leaks
// into the mic, and Gemini would hear its own voice, think the learner interrupted, and stop talking.
const tutorTalking = t => t.playing.size > 0 || performance.now() < (t.quietUntil || 0);
async function startMic(t){
  t.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
  const ctx = t.inCtx, ratio = ctx.sampleRate / 16000;
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'text/javascript' })));
  const node = new AudioWorkletNode(ctx, 'cap');
  let buf = [], n = 0;
  node.port.onmessage = e => {
    if (tutorTalking(t)){ buf = []; n = 0; return; }
    buf.push(e.data); n += e.data.length;
    if (n < 1600 * ratio) return;
    const all = new Float32Array(n); let o = 0;
    for (const f of buf){ all.set(f, o); o += f.length; }
    buf = []; n = 0;
    const pcm = new Int16Array(Math.floor(all.length / ratio));
    for (let i = 0; i < pcm.length; i++){                         // average each window down to one 16 kHz sample
      const a = Math.floor(i * ratio), b = Math.max(a + 1, Math.floor((i + 1) * ratio));
      let s = 0; for (let j = a; j < b; j++) s += all[j];
      pcm[i] = Math.max(-1, Math.min(1, s / (b - a))) * 0x7fff;
    }
    if (t.ws?.readyState === 1 && t.ready) t.ws.send(JSON.stringify({ realtimeInput: { audio: { data: bytesToB64(new Uint8Array(pcm.buffer)), mimeType: 'audio/pcm;rate=16000' } } }));
  };
  ctx.createMediaStreamSource(t.stream).connect(node);
}

/* Playback: Gemini sends 24 kHz 16-bit PCM; queue chunks back to back. */
function playChunk(t, b64){
  const bytes = b64ToBytes(b64), pcm = new Int16Array(bytes.buffer, 0, bytes.length >> 1);
  const audio = t.outCtx.createBuffer(1, pcm.length, 24000), ch = audio.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 0x8000;
  if (t.outCtx.state !== 'running') t.outCtx.resume().catch(() => {});   // phones can pause audio when the mic switches on
  const src = t.outCtx.createBufferSource(); src.buffer = audio; src.connect(t.outCtx.destination);
  t.next = Math.max(t.next, t.outCtx.currentTime + 0.05);
  src.start(t.next); t.next += audio.duration;
  if (t === tutor && !t.playing.size) setStatus('Tutor is speaking…');
  t.playing.add(src);
  src.onended = () => {
    t.playing.delete(src);
    if (t === tutor && !t.playing.size){ t.quietUntil = performance.now() + 400; setStatus('<span class="live"></span> Your turn: speak now.'); }
  };
}
function stopPlayback(t){ t.playing.forEach(s => { try { s.stop(); } catch {} }); t.playing.clear(); t.next = 0; }

/* Listen/Slowly fallback when the browser has no Arabic voice: Gemini reads the exact phrase aloud.
   Audio is kept in memory, so tapping the same button again plays instantly. */
const sayCache = new Map();
let sayJob = null;
function geminiSay(text, slow, say){
  sayJob?.stop();
  const ctx = new AudioContext({ sampleRate: 24000 }); ctx.resume();
  const job = sayJob = { next: 0, playing: new Set(), outCtx: ctx, chunks: [],
    stop(){ clearTimeout(job.timer); stopPlayback(job); try { job.ws?.close(); } catch {} ctx.close().catch(() => {}); if (sayJob === job) sayJob = null; } };
  const id = (slow ? 'slow|' : '') + text;
  const doneAfterPlayback = () => { job.timer = setTimeout(() => { if (sayJob === job){ say(''); job.stop(); } }, Math.max(0, job.next - ctx.currentTime) * 1000 + 300); };
  if (sayCache.has(id)){ sayCache.get(id).forEach(c => playChunk(job, c)); say('Playing… <span class="muted">(Google voice)</span>'); return doneAfterPlayback(); }

  say('Getting Google\'s voice…');
  const ws = job.ws = new WebSocket(GEMINI_WS + encodeURIComponent(localStorage.getItem('gemini_key')));
  job.timer = setTimeout(() => { if (sayJob === job){ say('Google\'s voice did not answer. Check your internet connection and tap again.'); job.stop(); } }, 15000);
  ws.onopen = () => ws.send(JSON.stringify({ setup: {
    model: GEMINI_MODEL,
    generationConfig: { responseModalities: ['AUDIO'], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: 'Kore' } } } },
    systemInstruction: { parts: [{ text: `You are a text-to-speech voice. You will be given one Egyptian Arabic phrase. Say exactly that phrase once, in natural Egyptian (Cairo) pronunciation${slow ? ', very slowly and clearly, with a short pause between words' : ', clearly at a gentle pace'}. Say nothing else: no greeting, no translation, no comment.` }] },
  } }));
  ws.onmessage = async e => {
    const m = JSON.parse(typeof e.data === 'string' ? e.data : await e.data.text());
    if (sayJob !== job) return;
    if (m.setupComplete) return ws.send(JSON.stringify({ clientContent: { turns: [{ role: 'user', parts: [{ text }] }], turnComplete: true } }));
    const sc = m.serverContent; if (!sc) return;
    for (const p of sc.modelTurn?.parts || []) if (p.inlineData?.data){
      if (!job.chunks.length){ clearTimeout(job.timer); say('Playing… <span class="muted">(Google voice)</span>'); }
      job.chunks.push(p.inlineData.data); playChunk(job, p.inlineData.data);
    }
    if (sc.turnComplete){ if (job.chunks.length) sayCache.set(id, job.chunks); ws.onclose = null; ws.close(); doneAfterPlayback(); }
  };
  ws.onclose = e => { if (sayJob === job && !job.chunks.length){ say(`Google's voice couldn't play${e.reason ? ` (${esc(e.reason)})` : ''}. Check your Google key in Settings → Tutor setup.`); job.stop(); } };
}

async function startTutor(L, ex, prompt){
  const key = localStorage.getItem('gemini_key');
  if (!key) return show('progress', null, { askKey: true });
  stopTutor();
  // One audio context at the device's own rate, created right on the tap so phones allow sound.
  const ctx = new AudioContext(); ctx.resume();
  const t = tutor = { ready: false, next: 0, playing: new Set(), outCtx: ctx, inCtx: ctx };
  tutorBtn(true);
  document.getElementById('tutorBox').hidden = false;
  setStatus('Connecting…');
  try { await startMic(t); }
  catch (err){ setStatus(`<span style="color:var(--danger)">Microphone not available (${esc(err.message)}). Allow microphone access for this page, then try again.</span>`); return endTutorUI(); }
  if (tutor !== t) return;

  const ws = t.ws = new WebSocket(GEMINI_WS + encodeURIComponent(key));
  ws.onopen = () => ws.send(JSON.stringify({ setup: {
    model: GEMINI_MODEL,
    generationConfig: { responseModalities: ['AUDIO'], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: 'Kore' } } } },
    systemInstruction: { parts: [{ text: prompt || tutorPrompt(L, ex) }] },
    inputAudioTranscription: {},
    outputAudioTranscription: {},
  } }));
  ws.onmessage = async e => {
    const m = JSON.parse(typeof e.data === 'string' ? e.data : await e.data.text());
    if (m.setupComplete){
      t.ready = true;
      const cr = document.getElementById('composeRow'); if (cr) cr.hidden = false;   // typing works only while the conversation is live
      setStatus('<span class="live"></span> Live: just talk. The tutor will start.');
      ws.send(JSON.stringify({ clientContent: { turns: [{ role: 'user', parts: [{ text: 'Hi! I am ready to practise.' }] }], turnComplete: true } }));
      return;
    }
    const sc = m.serverContent; if (!sc) return;
    if (sc.interrupted) stopPlayback(t);                       // learner started talking: stop the tutor's audio
    for (const p of sc.modelTurn?.parts || []) if (p.inlineData?.data) playChunk(t, p.inlineData.data);
    if (sc.inputTranscription?.text) addText('me', sc.inputTranscription.text);
    if (sc.outputTranscription?.text) addText('tutor', sc.outputTranscription.text);
    if (sc.turnComplete) closeLine();
  };
  ws.onerror = () => {};
  ws.onclose = e => {
    if (tutor !== t) return;
    const why = e.reason ? esc(e.reason) : (t.ready ? 'The conversation ended.' : 'Could not connect. Check your Google key in Settings → Tutor setup.');
    setStatus(`${t.ready ? '' : '<span style="color:var(--danger)">'}${why}${t.ready ? '' : '</span>'} Tap "Start talking" to begin again.`);
    stopTutor(); endTutorUI(true);
  };
}

function sendTyped(text){
  if (!tutor?.ready) return;
  closeLine(); addText('me', text); closeLine();
  tutor.ws.send(JSON.stringify({ clientContent: { turns: [{ role: 'user', parts: [{ text }] }], turnComplete: true } }));
}
// The tutor button switches between Start and Stop (with a live dot) while a conversation runs.
function tutorBtn(live){
  const b = document.getElementById('tutorStart'); if (!b) return;
  b.className = `btn block ${live ? 'live-btn' : 'pale'}`; b.setAttribute('aria-pressed', live);
  b.innerHTML = live ? '<span class="live-dot" aria-hidden="true"></span><span>Stop talking with tutor</span>' : `${ic('mic')}<span>${b.dataset.label || 'Start talking with tutor'}</span>`;
}
function endTutorUI(keepLog){
  tutorBtn(false);
  const cr = document.getElementById('composeRow'); if (cr) cr.hidden = true;      // the transcript stays; typing hides until the next conversation
  if (!keepLog){ const b = document.getElementById('tutorBox'); if (b) b.hidden = true; }
}
function stopTutor(){
  const t = tutor; if (!t) return; tutor = null;
  try { t.ws?.close(); } catch {}
  t.stream?.getTracks().forEach(x => x.stop());
  stopPlayback(t); t.outCtx?.close().catch(() => {});
}

function show(view, id, opts = {}){
  stopTutor(); if ('speechSynthesis' in window) speechSynthesis.cancel();
  document.getElementById('m9sheet')?.remove();                 // Module 09's first-open note never stays over another page
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view || ((view === 'lesson' || view === 'overview' || view.startsWith('m9')) && b.dataset.v === 'dashboard')));
  $app.classList.toggle('wide', view === 'dashboard');          // Home uses the wide two-column layout
  ({ dashboard, lesson, overview, search, progress, finished, ...(HAS_M9 ? M9_VIEWS : {}) }[view])(id, opts);
  renderAppBar();                                               // the install / iPhone banner follows the current progress
  document.querySelector('.foot').classList.toggle('off', view !== 'progress');   // "Powered by" only on the Settings tab
  // Next card of the same lesson, in the one-column layout: open at the "Phrase x of y" line, so the phrase and the
  // Complete buttons are on screen without scrolling. Everything else opens at the top.
  const lp = view === 'lesson' && lastPage === view + '|' + (id || '') && !matchMedia('(min-width:1000px)').matches && $app.querySelector('.lprog');
  window.scrollTo(0, lp ? Math.max(0, lp.getBoundingClientRect().top + scrollY - document.querySelector('.top').offsetHeight - 12) : 0);
  animatePage(view, id);
}

// Page transition. A new page (or another lesson) gets the full entrance with its cards in a cascade;
// redrawing the same page, such as moving to the next phrase card, gets only a light ease on the main card.
let lastPage = '', animTimer = 0;
function animatePage(view, id){
  const key = view + '|' + (id || ''), same = key === lastPage; lastPage = key;
  $app.classList.remove('enter', 'enter-soft'); void $app.offsetWidth;            // restart the animation
  // Take the class off once it has played, so things shown later (search filtering, opened modules) don't replay it.
  clearTimeout(animTimer); animTimer = setTimeout(() => $app.classList.remove('enter', 'enter-soft'), 1100);
  if (same) return $app.classList.add('enter-soft');
  const BLOCKS = '.card, .pstat, .stat, details.mod, .lintro, .pv-lh, .hd-row, .hd, .h-sec, .title, .ltitle, .m9-card, .m9-h1, .m9-caution, .m9-peds, .m9-modrow, .m9-term';
  [...$app.querySelectorAll(BLOCKS)]
    .filter(el => !el.parentElement.closest(BLOCKS))                            // animate outer blocks, not the parts inside them
    .forEach((el, i) => { el.setAttribute('data-anim', ''); el.style.setProperty('--i', i); });
  $app.classList.add('enter');
}
