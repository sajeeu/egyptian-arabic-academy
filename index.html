    <p class="mres" id="modres" aria-live="polite" hidden></p>
    <div class="mods">` +
    MODULES.map(m => {
      if (HAS_M9 && m === 9) return m9HomeRow();                            // 36 lessons: the row opens the module page instead of expanding
      const ls = CURRICULUM.filter(l => l.module === m), count = s => ls.filter(l => status(l.id) === s).length;
      const parts = [`${count('complete')}/${ls.length} complete`, count('in_progress') && `${count('in_progress')} in progress`, count('not_started') && `${count('not_started')} not started`].filter(Boolean);
      const mm = String(m).padStart(2, '0'), full = count('complete') === ls.length;   // every lesson in the module is complete
      return `<details class="mod${count('complete') || count('in_progress') ? ' active' : ''}${full ? ' done' : ''}"><summary><span class="mod-num"${full ? ` aria-label="Module ${mm} complete"` : ''}>${full ? ic('check') : mm}</span>
          <span class="grow"><span class="mod-h">Module ${mm}${full ? `<span class="mod-done">${ic('checkCircle', 'sm')}Module complete</span>` : ''}</span><span class="mod-name">${esc(MODULE_NAMES[m])}</span><span class="mod-count">${full ? `All ${ls.length} lessons complete` : parts.join(' · ')}</span></span>
          <span class="dots" aria-hidden="true">${ls.map(l => `<span class="dot ${stCls[status(l.id)]}"></span>`).join('')}</span>
          <span class="chev-box">${ic('chev', 'chev')}</span></summary><div class="list">` +
        ls.map(l => { const st = status(l.id); return `<button class="lesson-row" data-q="${esc(l.title.toLowerCase())}" data-k="${l.id.toLowerCase().replace('_', '')}" onclick="show('overview','${l.id}')">
          <svg class="st ${stCls[st]}" viewBox="0 0 24 24" aria-hidden="true"><circle class="ring" cx="12" cy="12" r="9"/><path class="half" d="M12 3a9 9 0 0 1 0 18z"/><path class="tick" d="m8 12.5 2.8 2.8 5.4-5.7"/></svg>
          <span class="grow"><span class="l-meta"><span>${code(l.id)}</span><span aria-hidden="true">·</span><span class="l-st ${stCls[st]}">${stText[st]}</span></span><span class="l-title">${esc(l.title)}</span></span>
          <span class="view">${ic('eye')}View</span></button>`; }).join('') +
        `</div></details>`;
    }).join('') + `</div>
    <div class="mnone" id="modnone" hidden><span class="ico">${ic('search')}</span>
      <div><p style="margin:0;font-size:16px;font-weight:700;overflow-wrap:anywhere">No lessons match “<span id="modnoneq"></span>”</p>
        <p style="margin:4px 0 0;font-size:14px;color:var(--ink-2)">Try part of a lesson title, or an ID such as M03 or L05.</p></div>
      <button class="btn ghost" id="modnoneclear">Clear search</button></div>`;

  $app.innerHTML = `<div class="layout home"><section class="col-a">${a}</section><section class="col-b">${b}</section></div>`;
  // X on a secondary card: the first tap asks "Tap again to remove", the second (within 4 s) hides the card from Home.
  // Only the card is hidden: the lesson keeps its progress and stays "In progress" in All modules.
  $app.querySelectorAll('[data-dismiss]').forEach(b => b.onclick = () => {
    const id = b.dataset.dismiss;
    if (!b.classList.contains('armed')){
      b.classList.add('armed'); b.innerHTML = `${ic('xmark', 'sm')}<span>Tap again to remove</span>`; b.setAttribute('aria-label', `Tap again to remove ${label(id)} from Home`);
      clearTimeout(b._t); b._t = setTimeout(() => { if (b.isConnected){ b.classList.remove('armed'); b.innerHTML = ic('xmark', 'sm'); b.setAttribute('aria-label', `Remove ${label(id)} from Home`); } }, 4000);
      return;
    }
    S.dismissed = [...new Set([...(S.dismissed || []), id])]; save(); show('dashboard');
    toast(`${label(id)} removed from Home. Its progress is kept: open it from All modules to continue.`);
  });
  const colA = $app.querySelector('.col-a');                       // on wide screens the left column stays in view, if it fits
  if (colA.offsetHeight < innerHeight - 120) colA.classList.add('stick');

  // Module list: search filter and expand/collapse all
  const mods = [...$app.querySelectorAll('details.mod')], eb = document.getElementById('expandAll');
  const qIn = document.getElementById('modq');
  const syncBtn = () => { const vis = mods.filter(d => !d.hidden), all = vis.length > 0 && vis.every(d => d.open);
    eb.innerHTML = ic(all ? 'collapse' : 'expand', 'sm') + `<span>${all ? 'Collapse all' : 'Expand all'}</span>`; eb.disabled = !vis.length; };
  mods.forEach(d => d.addEventListener('toggle', syncBtn));
  // Opening a module: its lesson rows cascade in (skipped when the device asks for reduced motion).
  mods.forEach(d => d.addEventListener('toggle', () => {
    if (!d.open) return;
    [...d.querySelectorAll('.lesson-row:not([hidden])')].forEach((r, i) => r.style.setProperty('--i', i));
    d.classList.remove('opening'); void d.offsetWidth; d.classList.add('opening');
    clearTimeout(d._t); d._t = setTimeout(() => d.classList.remove('opening'), 700);
  }));
  eb.onclick = () => { const vis = mods.filter(d => !d.hidden), open = !vis.every(d => d.open); vis.forEach(d => d.open = open); syncBtn(); };
  const runSearch = () => {
    const shown = qIn.value.trim(), q = shown.toLowerCase(), qn = q.replace(/[^a-z0-9]/g, '');
    let lessons = 0, modsHit = 0;
    mods.forEach(d => {
      let hit = 0;
      d.querySelectorAll('.lesson-row').forEach(r => { const ok = !q || r.dataset.q.includes(q) || (!!qn && r.dataset.k.includes(qn)); r.hidden = !ok; hit += ok; });
      d.hidden = !hit; d.open = !!q && hit > 0; lessons += hit; modsHit += hit > 0;
    });
    document.getElementById('modclear').hidden = !qIn.value;
    const m9r = document.getElementById('m9row'); if (m9r) m9r.hidden = !!q;
    const res = document.getElementById('modres');
    res.hidden = !q || !modsHit;
    res.textContent = `Showing ${lessons} ${lessons === 1 ? 'lesson' : 'lessons'} in ${modsHit} ${modsHit === 1 ? 'module' : 'modules'} for “${shown}”`;
    document.getElementById('modnone').hidden = !q || modsHit > 0;
    document.getElementById('modnoneq').textContent = shown;
    syncBtn();
  };
  const clearSearch = () => { qIn.value = ''; runSearch(); qIn.focus(); };
  qIn.oninput = runSearch;
  document.getElementById('modclear').onclick = clearSearch;
  document.getElementById('modnoneclear').onclick = clearSearch;
  syncBtn();
}

function lessonHeader(L, extra = ''){
  const scen = L.scenario.replace(/\s*\(context: [^)]*\)\s*$/, ''), ctx = (L.scenario.match(/\(context: ([^)]*)\)\s*$/) || [])[1];
  return `<div class="backrow">
      <button class="btn ghost back" onclick="show('dashboard')">${ic('left', 'sm')}Back to Dashboard</button>
      <span class="code-pill">${label(L.id).replace(' ', ' · ')}</span>
    </div>
    <div class="lhead">
      <h1 class="ltitle">${esc(L.title)}</h1>
      <div class="lmeta">${ic('pin')}<p>${esc(scen)}</p></div>
      ${ctx ? `<span class="ctx-chip lctx">Context: ${esc(ctx)}</span>` : ''}
      ${extra}
    </div>`;
}

/* Lesson overview: opens first from the module list. Viewing it never changes progress. */
const ORDINAL = ['first', 'second', 'third', 'fourth', 'fifth', 'sixth', 'seventh', 'eighth', 'ninth', 'tenth'];
function overview(id){
  if (HAS_M9 && byId[id].module === 9) return m9Preview(id);   // conversation lessons have their own preview (m9.js)
  const L = byId[id], st = status(id), s = S.lessons[id], p = primary(), code = label(id);
  const stLabel = { not_started: 'Not Started', in_progress: 'In Progress', complete: 'Complete' }[st];
  const n = L.ex.length;
  const conf = s ? s.confirmed : [], cur = st === 'in_progress' ? s.idx : 0;
  const segs = `<div class="segs" role="img" aria-label="${conf.length} of ${n} phrases confirmed.${cur ? ` You are on phrase ${cur}.` : ''}" style="grid-template-columns:repeat(${n},minmax(0,1fr))">` +
    L.ex.map(e => `<span class="seg${conf.includes(e.n) ? ' done' : e.n === cur ? ' now' : ''}"></span>`).join('') + `</div>`;
  const back = `<button class="btn ghost block back" onclick="show('dashboard')">${ic('left', 'sm')}Back to Dashboard</button>`;
  let next;
  if (st === 'not_started'){
    const ip = CURRICULUM.filter(l => status(l.id) === 'in_progress').length + 1;
    const role = p === L ? `<b>${code} is your primary curriculum lesson.</b>`
      : `It becomes your ${ORDINAL[ip - 1] || 'number ' + ip} in-progress lesson. <b>${label(p.id)} stays the primary curriculum lesson.</b>`;
    next = `<div class="pv-ch"><h2 id="cont-h">Start this lesson</h2>
      <p><b>Start Lesson</b> begins ${code} at phrase 1 of ${n}, with nothing confirmed yet. ${role}</p></div>
      <div class="pv-btns"><button class="btn primary block go-btn" id="ovGo" onclick="startLesson('${id}');show('lesson','${id}')">${ic('playCircle')}Start Lesson</button>${back}</div>`;
  } else if (st === 'in_progress'){
    next = `<div class="pv-ch"><h2 id="cont-h">Continue this lesson</h2>${segs}
      <p>You're on phrase ${s.idx} of ${n}, with ${s.confirmed.length} confirmed. ${p === L ? `<b>This is your primary curriculum lesson.</b>` : `<b>${label(p.id)} stays the primary curriculum lesson.</b>`}</p></div>
      <div class="pv-btns"><button class="btn ${p === L ? 'primary' : 'pale'} block go-btn" id="ovGo" onclick="show('lesson','${id}')">${ic('playCircle')}${p === L ? 'Resume Curriculum Lesson' : 'Resume Lesson'}</button>${back}</div>`;
  } else {
    next = `<div class="pv-ch"><h2 id="cont-h">Lesson complete</h2>${segs}<p>You confirmed all ${n} phrases. Tap any phrase to hear it again.</p></div>
      <div class="pv-btns">${back}</div>`;
  }
  const scen = L.scenario.replace(/\s*\(context: [^)]*\)\s*$/, ''), ctx = (L.scenario.match(/\(context: ([^)]*)\)\s*$/) || [])[1];
  $app.classList.add('wide');
  $app.innerHTML = `<div class="pvw">
    <div class="lintro">
      <div class="backrow"><button class="btn ghost back" onclick="show('dashboard')">${ic('left', 'sm')}Back</button><span class="code-pill">${code.replace(' ', ' · ')}</span></div>
      <div class="lhead"><h1 class="ltitle ov-title">${esc(L.title)}</h1><p class="pv-mod">Module ${String(L.module).padStart(2, '0')} · ${esc(MODULE_NAMES[L.module])}</p></div>
    </div>
    <div class="pv">
      <section class="card pv-scn" aria-labelledby="scn-h">
        <div class="pv-scn-top">
          <div class="pv-h"><span class="pv-ico">${ic('chat', 'sm')}</span><h2 id="scn-h">Scenario</h2></div>
          <p class="pv-scen">${esc(scen)}</p>${ctx ? `<span class="ctx-chip">Context: ${esc(ctx)}</span>` : ''}
        </div>
        <div class="pv-stats">
          <div><span>Phrases</span><b>${n}</b></div>
          <div><span>Lesson status</span><span class="st-pill ${st}"><i aria-hidden="true"></i>${stLabel}</span></div>
        </div>
      </section>
      <section class="pv-list" aria-labelledby="exprs-h">
        <div class="pv-lh">
          <div class="between wrap-row"><h2 id="exprs-h">All ${n} phrases</h2><span class="ctx-chip">${ic('eye', 'sm')}Preview only</span></div>
          <p>The Arabic, pronunciation and English for each phrase, in lesson order. Looking at this page doesn't change your progress. Tap a phrase to hear it.</p>
        </div>
        <div class="card exprs-card"><ol class="exprs">` +
          L.ex.map(e => { const done = conf.includes(e.n), now = !done && e.n === cur;
            return `<li><button type="button" class="expr" data-n="${e.n}" aria-pressed="false">
              <span class="num${done ? ' done' : now ? ' now' : ''}">${e.n}</span>
              <span class="expr-t"><span class="expr-top"><span class="expr-ar" lang="ar" dir="rtl">${esc(e.ar)}</span>${done ? `<span class="chip-ok">${ic('check')}Confirmed</span>` : now ? '<span class="chip-now">Current</span>' : ''}</span>
                <span class="expr-lat">${esc(e.lat)}</span><span class="expr-en">${esc(e.en)}</span></span>
              <span class="spk" aria-hidden="true">${ic('volume')}</span></button></li>`; }).join('') +
        `</ol></div>
      </section>
      <section class="card pv-cont" aria-labelledby="cont-h">${next}</section>
    </div></div>`;

  // Tap an expression to hear it; its row stays highlighted while it plays.
  const rows = [...$app.querySelectorAll('.expr')];
  const lightRow = r => rows.forEach(x => { x.classList.toggle('on', x === r); x.setAttribute('aria-pressed', x === r); });
  rows.forEach(r => r.onclick = () => {
    const e = L.ex[+r.dataset.n - 1]; lightRow(r);
    speak(e.ar, 0.85, t => { if (!t){ lightRow(null); return; } if (!/^(Playing|Starting|Getting)/.test(t)){ lightRow(null); toast(t); } });
  });
}

// Shown above the next lesson. If that lesson finished its whole module, the module gets a green banner.
function finishNote(doneId){
  const m = byId[doneId].module, mm = String(m).padStart(2, '0');
  if (CURRICULUM.filter(l => l.module === m).every(l => isDone(l.id)))
    return `<div class="mod-banner">${ic('checkCircle')}<div><b>Module ${mm} complete: ${esc(MODULE_NAMES[m])}</b><span>Mabrouk! You finished all its lessons. Here's your next lesson.</span></div></div>`;
  return note('spark', `<b>${esc(byId[doneId].title)}</b> (${label(doneId)}) complete! Here's your next lesson.`);
}

function lesson(id, opts){
  const L = byId[id], st = status(id);
  if (HAS_M9 && L.module === 9) return m9Lesson(id, opts);   // conversation lessons have their own pages (m9.js)

  if (st === 'not_started') return overview(id);   // preview: does not change status
  if (st === 'complete'){               // review only
    $app.innerHTML = lessonHeader(L, `<div class="eyebrow" style="margin-top:10px">${ic('checkCircle', 'sm st-done')} Completed · tap a phrase to hear it</div>`) +
      `<div class="card" style="padding:6px 16px">` +
      L.ex.map(e => `<button class="result" onclick="speak(${esc(JSON.stringify(e.ar))})">
        <span class="tag">${e.n}</span><span class="grow"><span class="ar" style="display:block">${esc(e.ar)}</span><b>${esc(e.lat)}</b> · <span class="muted">${esc(e.en)}</span></span>${ic('volume')}</button>`).join('') +
      `</div>`;
    return;
  }

  const s = S.lessons[id], ex = L.ex[s.idx - 1], last = s.idx === L.ex.length;
  const n = L.ex.length;
  if (S.dismissed?.includes(id)){ S.dismissed = S.dismissed.filter(x => x !== id); save(); }   // opened again: its Home card returns
  $app.classList.add('wide');                       // the lesson uses the wider page, like Home
  $app.innerHTML = `<div class="lesson">
    ${opts.justFinished ? finishNote(opts.justFinished) : ''}
    <div class="lintro">
      ${lessonHeader(L)}
      <div class="lprog">
        <div class="lc-prog"><b>Phrase ${s.idx} of ${n}</b>${s.confirmed.length ? `<span class="conf">${ic('check')}${s.confirmed.length} confirmed</span>` : `<span class="conf zero">0 confirmed</span>`}</div>
        <div class="segs" role="img" aria-label="${s.confirmed.length} of ${n} phrases confirmed. You are on phrase ${s.idx}." style="grid-template-columns:repeat(${n},minmax(0,1fr))">${L.ex.map(e => `<span class="seg${s.confirmed.includes(e.n) ? ' done' : e.n === s.idx ? ' now' : ''}"></span>`).join('')}</div>
      </div>
    </div>

    <div class="stage">
      <section class="card phrase" aria-labelledby="phrase-h">
        <div class="phrase-text">
          <h2 class="badge" id="phrase-h">Phrase ${s.idx}</h2>
          <div class="arabic${ex.ar.length > 18 ? ' long' : ''}" lang="ar" dir="rtl">${esc(ex.ar)}</div>
          <div class="latin">${esc(ex.lat)}</div>
          <div class="english">${esc(ex.en)}</div>
        </div>
        <div class="tiles" role="group" aria-label="Audio practice">
          <button type="button" class="tile lead" id="play"><span class="tile-ic">${ic('volume')}</span>Listen</button>
          <button type="button" class="tile" id="slow"><span class="tile-ic">${ic('slow')}</span>Slowly</button>
          <button type="button" class="tile rec" id="mic"><span class="tile-ic">${ic('mic')}</span>Say it</button>
        </div>
        <div id="heard"></div>
      </section>

      <div class="side">
        <section class="card tutor-card" aria-labelledby="tutor-h">
          <div class="tutor-head">
            <span class="tutor-ico">${ic('headset')}</span>
            <div class="grow"><h2 id="tutor-h" class="tutor-t">Practise with your tutor</h2>
              <p class="tutor-d">Talk out loud about this phrase: say it, ask what it means, or role-play the scene. Stop whenever you like.</p></div>
          </div>
          <button type="button" class="btn pale block" id="tutorStart" aria-pressed="false"></button>
          <div id="tutorBox" hidden>
            <div class="log" id="log"></div>
            <div id="tstatus" class="tstatus"></div>
            <div class="compose" id="composeRow" hidden>
              <input type="text" id="typed" placeholder="…or type a message" class="grow">
              <button class="btn ghost" id="send" aria-label="Send message">${ic('send')}</button>
            </div>
          </div>
        </section>

        <div class="actions">
          <button class="btn primary block go" id="ok">${last ? 'Complete & Next Lesson' : 'Complete & Next Card'}${ic(last ? 'check' : 'right')}</button>
          <button class="btn ghost block again" id="again">${ic('retry', 'sm')}Not Complete — Practice Again</button>
          <div id="againMsg"></div>
          <div class="hint">${ic('info', 'sm')}<span>Tap Complete when <i>you</i> feel ready. It's your own confirmation, not a pronunciation score.</span></div>
        </div>
      </div>
    </div></div>`;

  const heard = document.getElementById('heard');
  // A tile stays highlighted while its audio plays (or while listening), and clears when it ends or fails.
  const tiles = { play: document.getElementById('play'), slow: document.getElementById('slow'), mic: document.getElementById('mic') };
  let lit = null, litTimer = 0;
  const light = k => { Object.entries(tiles).forEach(([key, b]) => { b.classList.toggle('on', key === k); b.setAttribute('aria-pressed', key === k); });
    lit = k; clearTimeout(litTimer); if (k) litTimer = setTimeout(() => light(null), 20000); };
  const audioMsg = t => { heard.innerHTML = t ? note('volume', t) : ''; if (!t || !/^(Playing|Starting|Getting)/.test(t)) light(null); };
  tiles.play.onclick = () => { light('play'); speak(ex.ar, 0.85, audioMsg); };
  tiles.slow.onclick = () => { light('slow'); speak(ex.ar, 0.55, audioMsg); };
  tiles.mic.onclick = () => { light('mic'); listen(heard, () => { if (lit === 'mic') light(null); }); };
  tutorBtn(false);
  document.getElementById('tutorStart').onclick = () => {
    if (tutor){ stopTutor(); setStatus('Conversation ended.'); endTutorUI(true); } else startTutor(L, ex);
  };
  const typed = document.getElementById('typed');
  const send = () => { const t = typed.value.trim(); if (t && tutor?.ready){ typed.value = ''; sendTyped(t); } };
  document.getElementById('send').onclick = send;
  typed.onkeydown = e => { if (e.key === 'Enter') send(); };
  document.getElementById('ok').onclick = e => { e.currentTarget.disabled = true; confirmExpression(id, s.idx); };
  document.getElementById('again').onclick = () => {
    document.getElementById('againMsg').innerHTML = note('retry', 'No problem, nothing has changed. Listen again, say it slowly a few times, or talk it through with the tutor.');
  };
}

function search(){
  $app.innerHTML = `<h1 class="title">Search phrases</h1>
    <div class="card">
      <div class="searchbox">${ic('search')}<input type="text" id="q" placeholder="Search Arabic, pronunciation or English…" autofocus>
        <button type="button" class="mclear sclear" id="qclear" aria-label="Clear search" hidden>${ic('xmark')}</button></div>
      <div id="res" class="small muted" style="margin-top:12px"></div>
    </div>`;
  const q = document.getElementById('q'), res = document.getElementById('res');
  const norm = s => s.toLowerCase().replace(/[ً-ْ'’]/g, '');
  // Common searches shown while the box is empty. Each one matches phrases in the curriculum (checked in regression.js).
  const COMMON = { 'Everyday': ['hello', 'good morning', 'how are you', 'thank you', 'please', 'sorry', 'where is', 'how much', 'today', 'wait', 'understand', 'repeat', 'slowly'],
    'At the hospital': ['doctor', 'nurse', 'patient', 'pain', 'medicine', 'blood', 'pressure', 'temperature', 'fever', 'test', 'results', 'head', 'stomach', 'x-ray', 'emergency'],
    ...(HAS_M9 ? { 'Pediatrics': ['baby', 'child', 'my son', 'daughter', 'feeding', 'diaper', 'weight', 'vaccine', 'cough', 'vomiting', 'diarrhea', 'rash', 'asthma', 'inhaler', 'seizure'] } : {}) };
  const chips = () => `<p class="chips-intro">Type to search all ${N_PHRASES} phrases, or tap a common word:</p>` +
    Object.entries(COMMON).map(([g, ws]) => `<div class="chip-group"><b>${g}</b><div class="chips">${ws.map(w => `<button type="button" class="chip" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div></div>`).join('');
  let hits = [];
  res.innerHTML = chips();
  // X clears the search and goes back to the common words (without opening the keyboard).
  const qclear = document.getElementById('qclear');
  qclear.onclick = () => { q.value = ''; q.oninput(); q.blur(); window.scrollTo(0, 0); };
  q.oninput = () => {
    const t = norm(q.value.trim());
    qclear.hidden = !q.value;
    if (!t){ res.innerHTML = chips(); return; }
    hits = [];
    for (const L of CURRICULUM) for (const e of L.ex) if ([e.ar, e.lat, e.en].some(x => norm(x).includes(t))) hits.push([L, e]);
    // Each match: Listen and Slowly play it here; the rest opens the lesson overview (viewing never changes progress).
    const vocab = HAS_M9 ? m9SearchVocab(t, norm) : '';                   // Module 09 vocabulary terms are their own result type
    res.innerHTML = vocab + (hits.length ? `<div style="margin-bottom:6px">${hits.length} match${hits.length === 1 ? '' : 'es'}${hits.length > 60 ? ' (showing 60)' : ''}</div>` +
      hits.slice(0, 60).map(([L, e], i) => `<div class="result">
        <button class="r-open" data-i="${i}" aria-label="Open ${label(L.id)} overview: ${esc(e.en)}"><span class="ar" lang="ar" style="display:block">${esc(e.ar)}</span><b>${esc(e.lat)}</b> · ${esc(e.en)}
          <span style="display:block;margin-top:6px">${HAS_M9 ? m9SearchWho(L, e) : ''}<span class="tag">${label(L.id)} · ${e.n}</span></span></button>
        <span class="r-play"><button class="btn pale sm" data-i="${i}" data-rate="0.85" aria-label="Listen">${ic('volume', 'sm')}<span>Listen</span></button>
          <button class="btn ghost sm" data-i="${i}" data-rate="0.55" aria-label="Listen slowly">${ic('slow', 'sm')}<span>Slowly</span></button></span></div>`).join('')
      : vocab ? '' : `<p class="chips-intro"><b>No matches for “${esc(q.value.trim())}”.</b></p>` + chips());
  };
  res.onclick = e => {
    const c = e.target.closest('button[data-w]'); if (c){ q.value = c.dataset.w; q.oninput(); return; }
    const b = e.target.closest('button[data-i]'); if (!b) return;
    const [L, ex] = hits[+b.dataset.i];
    if (b.dataset.rate) speak(ex.ar, +b.dataset.rate); else show('overview', L.id);
  };
}

function progress(_, opts){
  const ip = CURRICULUM.filter(l => status(l.id) === 'in_progress').length, d = S.completed.length;
  const hasKey = !!localStorage.getItem('gemini_key');
  const ph = confirmedCount();
  const modRows = MODULES.map(m => {
    const ls = CURRICULUM.filter(l => l.module === m), c = ls.filter(l => isDone(l.id)).length, p = ls.filter(l => status(l.id) === 'in_progress').length;
    const mm = String(m).padStart(2, '0'), full = c === ls.length;
    return `<div class="mrow${full ? ' done' : ''}"><span class="mnum${full ? ' done' : c || p ? ' active' : ''}"${full ? ` aria-label="Module ${mm} complete"` : ''}>${full ? ic('check') : mm}</span>
      <div class="mrow-b"><div class="mrow-t"><span class="mrow-n">${esc(MODULE_NAMES[m])}</span>
        <span class="mrow-c">${p ? `<span class="mrow-p">${p} in progress</span>` : ''}${full ? `<span class="conf">${ic('check')}Complete</span>` : `<span>${c}/${ls.length}</span>`}</span></div>
        ${HAS_M9 && m === 9 ? m9SettingsBar(c, p) : `<div class="bar8" role="img" aria-label="${c} of ${ls.length} lessons complete${p ? `, ${p} in progress` : ''}">${ls.map(l => `<span class="${isDone(l.id) ? 'c' : status(l.id) === 'in_progress' ? 'p' : ''}"></span>`).join('')}</div>`}</div></div>`; }).join('');
  $app.classList.add('wide');
  $app.innerHTML = `<div class="pgw">
    <h1 class="ltitle">Progress &amp; settings</h1>
    <div class="pg"><div class="pg-col">
      <section class="pstats o1" aria-label="Lesson totals">
        <div class="pstat"><span class="pst-ic">${ic('cap')}</span><div><b>${d}</b><span>Complete</span></div></div>
        <div class="pstat sand"><span class="pst-ic">${ic('clock')}</span><div><b>${ip}</b><span>In progress</span></div></div>
        <div class="pstat grey"><span class="pst-ic">${ic('circle')}</span><div><b>${N_LESSONS - d - ip}</b><span>Not started</span></div></div>
      </section>

      <section class="card pcard o2" aria-labelledby="mods-h">
        <div class="between wrap-row"><h2 id="mods-h">Modules</h2><span class="conf">${ic('check')}${ph} ${ph === 1 ? 'phrase' : 'phrases'} confirmed</span></div>
        <div>${modRows}</div>
        <div class="pfoot">${ic('info', 'sm')}<p>A phrase counts as complete when you confirm it yourself. The app doesn't score your pronunciation.</p></div>
      </section>

      <section class="card pcard o6" id="installCard" aria-labelledby="a2hs-h"${isInstalled() ? ' hidden' : ''}>
        <div class="tutor-head"><span class="tutor-ico green">${ic('phone')}</span>
          <div class="grow"><h2 id="a2hs-h">Add to Home Screen</h2><p class="pdesc">Put the academy on your phone's home screen. It then opens full screen, like an app.</p></div></div>
        <button class="btn primary" id="installBtn"${installPrompt ? '' : ' hidden'}>${ic('download', 'sm')}Add to Home Screen</button>
        <div class="howto">
          <div class="tint${isIOS ? ' first' : ''}"><b>iPhone or iPad</b><p>In Safari, tap the Share button, then <b>Add to Home Screen</b>.</p>
            <div class="ios-warn">${ic('alert', 'sm')}<p><b>Important:</b> on iPhone and iPad the Home Screen icon keeps its own progress, separate from Safari. If you've already started in Safari, first tap <b>Save backup file</b> (in Daily backup on this page). Then open the new icon, go to Settings and tap <b>Load backup file</b>.</p></div></div>
          <div class="tint"><b>Android</b><p>In Chrome, tap the ⋮ menu, then <b>Add to Home screen</b> or <b>Install app</b>.</p></div>
        </div>
      </section>
    </div>

    <div class="pg-col">
      <section class="card pcard o3" id="keycard" aria-labelledby="tutor-h">
        <div class="tutor-head"><span class="tutor-ico">${ic('key')}</span>
          <div class="grow"><div class="between wrap-row"><h2 id="tutor-h">Tutor setup</h2>${hasKey ? `<span class="chip-ok">${ic('check')}Key saved</span>` : `<span class="tag">No key yet</span>`}</div>
            <p class="pdesc">The tutor is a live voice conversation powered by Google Gemini Live. It needs a free Google AI Studio API key, saved only in this browser. Google's free tier has usage limits. If this browser has no Arabic voice, Listen and Slowly also use this key to play Google's voice.</p></div></div>
        ${opts?.askKey ? note('info', 'Add your Google API key to start talking with the tutor. Everything else in the app works without it.') : ''}
        ${hasKey ? '' : `<div><a class="btn pale block" id="getKey" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">${ic('external', 'sm')}Get a free Google key</a>
          <p class="pdesc" style="margin-top:8px;text-align:center">Opens Google AI Studio in a new tab. Sign in, tap <b>Create API key</b>, copy it, then come back and paste it below.</p></div>`}
        <div class="keyrow"><label class="sr" for="key">Google API key</label><input type="password" id="key" autocomplete="off" spellcheck="false" placeholder="${hasKey ? 'Enter a new key to replace the saved one' : 'Paste your Google API key'}">
          <button class="btn primary" id="saveKey" disabled>${ic('check', 'sm')}Save</button></div>
      </section>

      <section class="card pcard o5" aria-labelledby="move-h">
        <div><h2 id="move-h">Move to another device</h2><p class="pdesc">Your progress saves automatically in this browser. The easiest way to move it is <b>Save backup file</b> here, then <b>Load backup file</b> on the other device. You can also copy it as text.</p></div>
        <details class="adv" id="stateBox"><summary>${ic('chev', 'chev')}<span>Show progress text</span></summary>
          <div class="adv-in">
            <label class="sr" for="state">Progress text</label>
            <textarea id="state" class="code" spellcheck="false" autocomplete="off">ACADEMY_STATE_V9\n${esc(JSON.stringify(S))}</textarea>
            <div class="row">
              <button class="btn pale" id="copyState">${ic('copy', 'sm')}Copy</button>
              <button class="btn ghost" id="importState">${ic('upload', 'sm')}Load pasted progress</button>
            </div>
            <div id="stateMsg"></div>
          </div>
        </details>
        <div class="reset-row"><p class="pdesc">Start again from lesson 1. This erases all progress in this browser.</p>
          <button class="btn danger" id="reset">${ic('trash', 'sm')}Start over</button></div>
      </section>

      <section class="card pcard o4" id="backupCard" aria-labelledby="backup-h">
        <div><h2 id="backup-h">Daily backup</h2><p class="pdesc">A copy of your progress is saved in this browser every day at 23:00, and the last 7 are kept. If the app is closed at 23:00, the copy is made the next time you open it. Clearing this browser's data also erases these copies, so now and then save a backup file too.</p></div>
        ${(() => { const list = backups();
          if (!list.length) return `<p class="pdesc">No daily backup yet. The first one is saved at 23:00 after you start a lesson.</p>`;
          const row = (b, i) => { const t = new Date(b.at);      // when the copy was actually made
            const when = t.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }) + ', ' + t.toTimeString().slice(0, 5);
            const bp = Object.values(b.state.lessons || {}).reduce((a, x) => a + x.confirmed.length, 0);
            return `<div class="tint bk-row"><div><b>Saved ${esc(when)}</b><span>${(b.state.completed || []).length}/${N_LESSONS} lessons complete · ${bp} ${bp === 1 ? 'phrase' : 'phrases'} confirmed</span></div>
              <button class="btn ghost again" data-bk="${i}">${ic('retry', 'sm')}Restore</button></div>`; };
          // The newest backup is always shown; older ones fold away until asked for.
          const older = list.length - 1;
          return `<div class="bk-list">${row(list[0], 0)}</div>` + (older ? `<details class="adv bk-more" id="bkMore"><summary>${ic('chev', 'chev')}<span>Show ${older} older ${older === 1 ? 'backup' : 'backups'}</span></summary>
            <div class="adv-in"><div class="bk-list">${list.slice(1).map((b, i) => row(b, i + 1)).join('')}</div></div></details>` : ''); })()}
        <div class="row pair">
          <button class="btn pale" id="saveFile">${ic('download', 'sm')}Save backup file</button>
          <label class="btn ghost" for="loadFile">${ic('upload', 'sm')}Load backup file</label>
          <input type="file" id="loadFile" accept=".txt,text/plain" hidden>
        </div>
        <div id="bkMsg"></div>
      </section>
    </div></div></div>`;
  const bkMore = document.getElementById('bkMore');      // the fold's label follows its state
  if (bkMore) bkMore.addEventListener('toggle', () => { const s = bkMore.querySelector('summary span'), n = backups().length - 1;
    s.textContent = bkMore.open ? `Hide older ${n === 1 ? 'backup' : 'backups'}` : `Show ${n} older ${n === 1 ? 'backup' : 'backups'}`; });
  const keyIn = document.getElementById('key');
  keyIn.oninput = () => document.getElementById('saveKey').disabled = !keyIn.value.trim();
  if (opts?.askKey) document.getElementById('keycard').scrollIntoView();
  const stateMsg = h => document.getElementById('stateMsg').innerHTML = h;
  document.getElementById('saveKey').onclick = () => {
    const v = document.getElementById('key').value.trim();
    if (v){ localStorage.setItem('gemini_key', v); localStorage.removeItem('anthropic_key'); progress(); toast('Key saved. Open a lesson and tap "Start talking with tutor".'); }
  };
  document.getElementById('copyState').onclick = e => {
    const b = e.currentTarget, ta = document.getElementById('state');
    navigator.clipboard.writeText(ta.value).then(() => b.innerHTML = ic('check', 'sm') + 'Copied', () => { ta.select(); toast('Press Ctrl+C to copy the selected text.'); });
  };
  document.getElementById('importState').onclick = () => {
    const st = parseSnapshot(document.getElementById('state').value);
    if (!st) return stateMsg(warn("That text isn't a valid progress snapshot. Nothing was changed."));
    S = st; save(); show('dashboard'); toast('Progress loaded.');
  };

  // Backups: restore a daily copy (tap twice), or save / load a backup file (same text as the snapshot above).
  const bkMsg = h => document.getElementById('bkMsg').innerHTML = h;
  document.querySelectorAll('[data-bk]').forEach(b => b.onclick = async () => {
    const bk = backups()[+b.dataset.bk], when = b.closest('.bk-row').querySelector('b').textContent.replace(/^Saved /, '');
    if (!await confirmModal({ title: 'Restore this backup?', text: `Your progress goes back to how it was on ${esc(when)}. Anything you did after that is replaced.`, yes: 'Yes, restore', icon: 'retry' })) return;
    const st = parseSnapshot(snapshotText(bk.state));
    if (!st) return bkMsg(warn("That backup couldn't be read. Nothing was changed."));
    S = st; save(); show('dashboard'); toast('Progress restored from the daily backup.');
  });
  document.getElementById('saveFile').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([snapshotText(S)], { type: 'text/plain' }));
    a.download = `egyptian-arabic-academy-backup-${dayKey(new Date())}.txt`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    bkMsg(note('check', 'Your backup file is downloading. Keep it somewhere safe, for example email it to yourself. To use it, tap <b>Load backup file</b>.'));
  };
  document.getElementById('loadFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const st = parseSnapshot(await f.text()); e.target.value = '';
    if (!st) return bkMsg(warn("That file isn't an Egyptian Arabic Academy backup. Nothing was changed."));
    S = st; save(); show('dashboard'); toast('Progress loaded from the backup file.');
  };
  document.getElementById('installBtn').onclick = async () => {
    if (!installPrompt) return;
    installPrompt.prompt(); await installPrompt.userChoice; installPrompt = null; document.getElementById('installBtn').hidden = true;
  };
  document.getElementById('reset').onclick = async () => {
    if (!await confirmModal({ title: 'Start over?', text: 'This erases all progress saved in this browser: every completed lesson and confirmed phrase. Your daily backups are kept.', yes: 'Yes, start over', danger: true, icon: 'trash' })) return;
    S = freshState(); save(); show('dashboard'); toast(`Progress erased. Starting from 0/${N_LESSONS}.`);
  };
}

/* Confirmation pop-up for actions that replace or erase progress. Cancel has the focus, and the confirm
   button only works after a short pause, so a double tap or a stray tap can't confirm by accident. */
function confirmModal({ title, text, yes, danger = false, icon = 'alert' }){
  return new Promise(resolve => {
    const d = document.createElement('dialog');
    d.className = 'modal'; d.setAttribute('aria-labelledby', 'mdl-t'); d.setAttribute('aria-describedby', 'mdl-d');
    d.innerHTML = `<div class="mdl-in"><div class="mdl-ic${danger ? ' danger' : ''}">${ic(icon)}</div>
      <h2 id="mdl-t">${title}</h2><p id="mdl-d">${text}</p>
      <div class="mdl-btns"><button class="btn ghost" id="mdlNo">Cancel</button>
        <button class="btn ${danger ? 'danger-solid' : 'primary'}" id="mdlYes" disabled>${yes}</button></div></div>`;
    document.body.appendChild(d);
    const done = v => { if (!d.open) return; d.close(); d.remove(); resolve(v); };
    d.querySelector('#mdlNo').onclick = () => done(false);
    d.querySelector('#mdlYes').onclick = () => done(true);
    d.addEventListener('cancel', e => { e.preventDefault(); done(false); });        // Esc key / Android back
    d.addEventListener('click', e => { if (e.target === d) done(false); });        // tap outside the box
    d.showModal(); d.querySelector('#mdlNo').focus();
    setTimeout(() => { const y = d.querySelector('#mdlYes'); if (y) y.disabled = false; }, 800);
  });
}

function finished(){
  $app.classList.remove('wide');
  $app.innerHTML = `<div class="card" style="text-align:center;padding:36px 20px">
    <div class="logo" style="width:64px;height:64px;margin:0 auto 14px;border-radius:18px">${ic('cap', 'lg')}</div>
    <h1 class="title">Mabrouk! You finished all ${N_LESSONS} lessons.</h1><p class="muted">All ${MODULES.length} modules complete. Revisit any lesson from Search to review it.</p>

}

document.getElementById('logoMark').innerHTML = ic('steth');

/* Add to Home Screen: Android Chrome offers its own install prompt, which the Progress page can show. */
function isInstalled(){ return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; const c = document.getElementById('installBtn'); if (c) c.hidden = false; renderAppBar(); });
addEventListener('appinstalled', () => { installPrompt = null; const c = document.getElementById('installCard'); if (c) c.hidden = true; renderAppBar(); });

/* A banner under the header, shown at most once per kind, and never once dismissed:
   - Android phones and tablets: offer to install the app (uses Chrome's own install prompt).
   - The iPhone/iPad Home Screen app with no progress yet: explain how to bring progress over from Safari. */
function flagOff(k){ try { return localStorage.getItem(k) === '1'; } catch { return false; } }
function setFlagOff(k){ try { localStorage.setItem(k, '1'); } catch {} }
function renderAppBar(){
  const bar = document.getElementById('appbar'); if (!bar) return;
  const noProgress = !S.completed.length && !Object.keys(S.lessons).length;
  let kind = null;
  if (installPrompt && !isInstalled() && matchMedia('(pointer: coarse)').matches && !flagOff('eaa_install_banner_off')) kind = 'install';
  else if (isIOS && isInstalled() && noProgress && !flagOff('eaa_ios_move_hint_off')) kind = 'iosmove';
  bar.hidden = !kind; if (!kind) return (bar.innerHTML = '');
  const close = `<button class="btn" id="appbarNo">${kind === 'install' ? 'Not now' : 'Got it'}</button>`;
  bar.innerHTML = kind === 'install'
    ? `<div class="note">${ic('phone')}<div><b>Install the academy as an app.</b> It gets its own icon and opens full screen.</div><button class="btn" id="appbarYes">${ic('download', 'sm')}Install</button>${close}</div>`
    : `<div class="note">${ic('info')}<div><b>Started in Safari before?</b> Your progress there stays in Safari. To bring it here: in Safari, open Settings and tap <b>Save backup file</b>; then here, open Settings and tap <b>Load backup file</b>.</div>${close}</div>`;
  document.getElementById('appbarNo').onclick = () => { setFlagOff(kind === 'install' ? 'eaa_install_banner_off' : 'eaa_ios_move_hint_off'); renderAppBar(); };
  const yes = document.getElementById('appbarYes');
  if (yes) yes.onclick = async () => { if (!installPrompt) return; installPrompt.prompt(); const r = await installPrompt.userChoice; installPrompt = null;
    if (r?.outcome !== 'accepted') setFlagOff('eaa_install_banner_off'); renderAppBar(); };
}

/* ---------- Microphone permission ----------
   "Say it" and the voice tutor need the microphone. The app asks when it opens and shows a banner while it is off. */
let micState = 'prompt';   // granted | prompt | denied | nomic | unsupported
function renderMicBar(){
  const bar = document.getElementById('micbar');
  const btn = label => `<button class="btn" onclick="requestMic()">${ic('mic', 'sm')}${label}</button>`;
  // How to unblock depends on where the app runs: the installed app has no address bar.
  const unblock = !isInstalled() ? `tap the lock or <b>ⓘ</b> icon next to the web address, set <b>Microphone</b> to <b>Allow</b>, then reload the page.`
    : isIOS ? `open your phone's <b>Settings</b>, find <b>Safari</b>, then <b>Microphone</b>, and choose <b>Allow</b>. Then reopen the academy.`
    : `press and hold the academy's icon, tap <b>App info</b> (ⓘ), then <b>Permissions</b> or <b>Site settings</b>, and allow the <b>Microphone</b>. Then reopen the academy.`;
  const html = flagOff('eaa_mic_banner_off_' + micState) ? null : {       // "Not now" hides the banner for that state
    prompt: note('mic', `<b>Microphone is off.</b> "Say it" and talking with the tutor need it.`) ,
    denied: warn(`<b>Microphone is blocked.</b> To use "Say it" and the voice tutor: ${unblock}`),
    nomic: warn(`<b>No microphone was found.</b> Connect or switch on a microphone to use "Say it" and the voice tutor, then tap Try again.`),
    unsupported: warn(`<b>This browser can't use the microphone here.</b> Open the app in Chrome, Edge or Safari to use "Say it" and the voice tutor.`),
  }[micState];
  bar.hidden = !html;
  if (!html) return (bar.innerHTML = '');
  bar.innerHTML = html;
  bar.firstElementChild.insertAdjacentHTML('beforeend', (micState !== 'unsupported' ? btn(micState === 'prompt' ? 'Turn on microphone' : 'Try again') : '') +
    `<button class="btn" id="micNo">Not now</button>`);
  // Listen, Slowly and the rest of the app work without the microphone, so the banner can be put away.
  document.getElementById('micNo').onclick = () => { setFlagOff('eaa_mic_banner_off_' + micState); renderMicBar(); };
}
function setMic(state){ micState = state; if (state === 'granted') localStorage.setItem('mic_ok', '1'); renderMicBar(); }
async function requestMic(){
  if (!navigator.mediaDevices?.getUserMedia) return setMic('unsupported');
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    s.getTracks().forEach(t => t.stop());                      // only asking permission; release the mic straight away
    setMic('granted');
  } catch (err){
    if (err.name === 'NotFoundError' || err.name === 'OverconstrainedError') return setMic('nomic');
    localStorage.removeItem('mic_ok');
    // A dismissed prompt is still "prompt"; a refusal is "denied".
    const p = await navigator.permissions?.query({ name: 'microphone' }).catch(() => null);
    setMic(p && p.state === 'prompt' ? 'prompt' : 'denied');
  }
}
(async () => {
  if (!navigator.mediaDevices?.getUserMedia) return setMic('unsupported');
  const p = await navigator.permissions?.query({ name: 'microphone' }).catch(() => null);
  if (p){
    p.onchange = () => setMic(p.state);                          // follows changes made in the browser's site settings
    if (p.state !== 'prompt') return setMic(p.state);
  } else if (localStorage.getItem('mic_ok')) return setMic('granted');   // browsers without the Permissions API
  renderMicBar(); requestMic();                                 // first visit: ask now
})();
</script>
